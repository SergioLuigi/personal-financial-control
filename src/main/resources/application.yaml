spring:
  application:
    name: personal-financial-control

  # Each environment supplies its own connection; see application-local.yaml for
  # the MySQL service of docker-compose.yaml.
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # MySQL's DATETIME carries no offset; pinning the JDBC time zone keeps the audit
        # Instants round-tripping consistently regardless of the JVM default zone.
        jdbc.time_zone: UTC
        # Every UUID is stored as varchar(36) (.claude/rules/database.md).
        type.preferred_uuid_jdbc_type: VARCHAR

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  mvc:
    problemdetails:
      enabled: true

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

server:
  servlet:
    context-path: /personal-financial-control

management:
  endpoints:
    web:
      exposure:
        include: health, info, modulith
  endpoint:
    health:
      show-details: when-authorized
