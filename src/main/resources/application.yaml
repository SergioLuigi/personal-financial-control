spring:
  application:
    name: personal-financial-control

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:personal_financial_control}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # MySQL's DATETIME carries no offset; pinning the JDBC time zone keeps the audit
        # Instants round-tripping consistently regardless of the JVM default zone.
        jdbc.time_zone: UTC

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  mvc:
    problemdetails:
      enabled: true

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

server:
  servlet:
    context-path: /personal-financial-control

management:
  endpoints:
    web:
      exposure:
        include: health, info, modulith
  endpoint:
    health:
      show-details: when-authorized
