databaseChangeLog:
  - changeSet:
      id: 001-create-bank-account-table
      author: sergioluigi
      changes:
        - createTable:
            tableName: bank_account
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_bank_account
              - column:
                  name: name
                  type: varchar(150)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(150)
                  constraints:
                    nullable: false
              - column:
                  name: balance
                  type: decimal(19, 2)
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: varchar(255)
              - column:
                  name: updated_by
                  type: varchar(255)
              - column:
                  name: created_at
                  type: datetime(6)
              - column:
                  name: updated_at
                  type: datetime(6)
        # Account names are unique per owner, not globally: two users must be able to
        # each have an account called "Savings".
        - addUniqueConstraint:
            tableName: bank_account
            columnNames: name, created_by
            constraintName: uk_bank_account_name_created_by
        # Backs the mandatory owner predicate applied to every query.
        - createIndex:
            tableName: bank_account
            indexName: idx_bank_account_created_by
            columns:
              - column:
                  name: created_by
      rollback:
        - dropTable:
            tableName: bank_account
